<section id="about" class="about">

  <h2 
    data-aos="fade-up" 
    data-aos-duration="500">
    {{ title }}
  </h2>

  <div class="row"
       data-aos="fade-up"
       data-aos-duration="500"
       data-aos-delay="100">

    <div class="left"
         data-aos="fade-right"
         data-aos-duration="400">
      {{ leftTitle }}
    </div>

    <div class="right">

      <div *ngFor="let info of infoList; let i = index"
           data-aos="fade-left"
           [attr.data-aos-delay]="100 + i * 50">
        <b>{{ info.label }}:</b> {{ info.value }}
      </div>

    </div>

  </div>

</section>

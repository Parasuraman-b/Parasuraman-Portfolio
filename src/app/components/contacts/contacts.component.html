<section id="contact" class="contact">

  <h2 data-aos="fade-up">Contact Me</h2>

  <div class="contact-box" data-aos="zoom-in">

    <form (ngSubmit)="submitForm()">

      <div class="form-group">
        <label>Your Name</label>
        <input type="text" placeholder="Enter your name" [(ngModel)]="form.name" name="name" required>
      </div>

      <div class="form-group">
        <label>Your Email</label>
        <input type="email" placeholder="Enter your email" [(ngModel)]="form.email" name="email" required>
      </div>

      <div class="form-group">
        <label>Your Message</label>
        <textarea rows="4" placeholder="Write your message here" [(ngModel)]="form.message" name="message" required></textarea>
      </div>

      <button type="submit">Send Message</button>

    </form>

  </div>

</section>
